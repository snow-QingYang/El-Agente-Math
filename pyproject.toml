[tool.uv.workspace]
members = [
    "packages/agent",
    "packages/data",
    "packages/benchmark",
    "packages/meta-agent",
]

[project]
name = "el-agente-math"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.8",
    "streamlit>=1.52.2",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (typer uses this)
]

[tool.ruff.lint.isort]
known-first-party = ["el_agente", "el_agente_data", "el_agente_bench", "meta_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "openreview.*",
    "pydantic_ai.*",
    "pylatexenc.*",
    "sympy.*",
    "pdfplumber.*",
    "streamlit.*",
    "tqdm.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "el_agente_data.mineru.*",
    "el_agente_data.cli",
    "el_agente_bench.ui.*",
    "el_agente_bench.cli",
    "meta_agent.*",
]
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
disallow_untyped_decorators = false
disallow_any_generics = false
