[project]
name = "el-agente"
version = "0.2.0"
description = "Agentic reader for mathematical formula error detection"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=1.36.0",
    "pylatexenc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/el_agente"]
