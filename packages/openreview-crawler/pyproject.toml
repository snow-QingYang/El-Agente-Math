[project]
name = "openreview-crawler"
version = "0.1.0"
description = "A Python package for crawling rejected papers and their reviews from OpenReview"
readme = "README.md"
authors = [
    { name = "Fangshi Du", email = "125781993+dufangshi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.6.1",
    "openreview-py>=1.54.1",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.1",
]

[project.scripts]
openreview-crawler = "openreview_crawler.cli:main"
openreview_crawler = "openreview_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openreview_crawler"]
