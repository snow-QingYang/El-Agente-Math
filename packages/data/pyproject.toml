[project]
name = "el-agente-data"
version = "0.2.0"
description = "Data collection, crawling, and parsing for El-Agente-Math"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.0",
    "openai>=2.6.1",
    "openreview-py>=1.54.1",
    "pdfplumber>=0.11.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
]

[project.scripts]
el-agente-data = "el_agente_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/el_agente_data"]
