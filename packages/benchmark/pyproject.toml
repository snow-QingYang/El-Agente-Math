[project]
name = "el-agente-bench"
version = "0.2.0"
description = "Benchmark runner and evaluation for El-Agente-Math"
requires-python = ">=3.12"
dependencies = [
    "el-agente",
    "el-agente-data",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.52.2",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
]

[project.scripts]
el-agente-bench = "el_agente_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/el_agente_bench"]
