[project]
name = "el-agente-meta"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "el-agente-bench",
    "el-agente",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "typer>=0.15",
]

[tool.uv.sources]
el-agente-bench = { workspace = true }
el-agente = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_agent"]

[project.scripts]
el-agente-meta = "meta_agent.cli:main"
